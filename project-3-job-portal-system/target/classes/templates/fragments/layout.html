<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- Header Fragment -->
    <header class="site-header" th:fragment="navbar(activePage)">
        <div class="container nav-container">
            <a th:href="@{/}" class="brand-logo">
                <div class="logo-badge">JP</div>
                <span>JobPortal<span style="color: var(--secondary)">.</span></span>
            </a>

            <ul class="nav-links">
                <li><a th:href="@{/jobs}" class="nav-link" th:classappend="${activePage == 'jobs' ? 'active' : ''}">Find Jobs</a></li>
                
                <!-- Student Navigation -->
                <li sec:authorize="hasRole('STUDENT')">
                    <a th:href="@{/my-applications}" class="nav-link" th:classappend="${activePage == 'applications' ? 'active' : ''}">My Applications</a>
                </li>
                <li sec:authorize="hasRole('STUDENT')">
                    <a th:href="@{/profile}" class="nav-link" th:classappend="${activePage == 'profile' ? 'active' : ''}">My Profile & Resume</a>
                </li>

                <!-- Employer Navigation -->
                <li sec:authorize="hasRole('EMPLOYER')">
                    <a th:href="@{/employer/dashboard}" class="nav-link" th:classappend="${activePage == 'employer' ? 'active' : ''}" style="color: #a5b4fc;">Employer Dashboard</a>
                </li>
                <li sec:authorize="hasRole('EMPLOYER')">
                    <a th:href="@{/employer/applicants}" class="nav-link" th:classappend="${activePage == 'applicants' ? 'active' : ''}">Applicants</a>
                </li>
                <li sec:authorize="hasRole('EMPLOYER')">
                    <a th:href="@{/employer/jobs/new}" class="nav-cta">+ Post a Job</a>
                </li>

                <!-- Admin Navigation -->
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/dashboard}" class="nav-link" th:classappend="${activePage == 'admin' ? 'active' : ''}" style="color: #f43f5e;">Admin Console</a>
                </li>

                <!-- Authentication -->
                <li sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}" class="nav-link">Sign In</a>
                </li>
                <li sec:authorize="!isAuthenticated()">
                    <a th:href="@{/register}" class="nav-cta">Register</a>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-secondary btn-sm" style="cursor: pointer;">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </header>

    <!-- Footer Fragment -->
    <footer class="site-footer" th:fragment="footer">
        <div class="container">
            <p>© 2026 Job Portal Management System • Spring Boot + Spring Security + JPA + Thymeleaf Fullstack Application</p>
        </div>
    </footer>

</body>
</html>
