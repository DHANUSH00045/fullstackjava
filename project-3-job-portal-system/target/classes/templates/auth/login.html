<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - JobPortal</title>
    <link rel="stylesheet" th:href="@{/css/jobportal.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div th:replace="fragments/layout :: navbar('auth')"></div>

    <main class="main-content" style="display: flex; align-items: center;">
        <div class="container" style="max-width: 440px;">

            <div class="card-panel">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <span class="badge-pill">Account Access</span>
                    <h2 style="font-size: 1.75rem; font-weight: 800;">Welcome Back</h2>
                    <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.25rem;">Sign in to your JobPortal account</p>
                </div>

                <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}"></div>
                <div th:if="${logoutMessage}" class="alert alert-success" th:text="${logoutMessage}"></div>
                <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

                <form th:action="@{/login-process}" method="post">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="username" class="form-control" placeholder="user@domain.com" required autofocus>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                        Sign In to Account
                    </button>
                </form>

                <p style="text-align: center; font-size: 0.85rem; color: var(--text-secondary); margin-top: 1.5rem;">
                    Don't have an account? <a th:href="@{/register}" style="color: var(--secondary); font-weight: 600;">Register here</a>
                </p>

                <!-- Demo Credentials Box -->
                <div style="margin-top: 1.5rem; padding: 1rem; background: rgba(255,255,255,0.03); border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--text-secondary); border: 1px solid var(--border-color);">
                    <strong>Pre-Seeded Demo Accounts:</strong><br>
                    • <strong>Student:</strong> <code style="color: #a5b4fc;">student@jobportal.com</code> / <code style="color: #a5b4fc;">student123</code><br>
                    • <strong>Employer:</strong> <code style="color: #06b6d4;">employer@google.com</code> / <code style="color: #06b6d4;">employer123</code><br>
                    • <strong>Admin:</strong> <code style="color: #f43f5e;">admin@jobportal.com</code> / <code style="color: #f43f5e;">admin123</code>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="fragments/layout :: footer"></div>

</body>
</html>
