<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - JobPortal'">Post Job</title>
    <link rel="stylesheet" th:href="@{/css/jobportal.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div th:replace="fragments/layout :: navbar('employer')"></div>

    <main class="main-content">
        <div class="container" style="max-width: 820px;">

            <a th:href="@{/employer/dashboard}" style="display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text-secondary); margin-bottom: 1.5rem; font-weight: 600;">
                ← Back to Dashboard
            </a>

            <div class="card-panel">
                <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
                    <span class="badge-pill">Job Manager</span>
                    <h1 style="font-size: 1.75rem; font-weight: 800;" th:text="${pageTitle}">Post New Job Opportunity</h1>
                    <p style="color: var(--text-secondary); font-size: 0.85rem;">Validated with Spring Validation (@NotNull, @Size, @NotBlank)</p>
                </div>

                <form th:action="@{/employer/jobs/save}" th:object="${jobDto}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <!-- Job Title -->
                    <div class="form-group">
                        <label class="form-label">Job Role / Title <span style="color: var(--danger)">*</span></label>
                        <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Senior Full Stack Engineer">
                        <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.25rem;"></p>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                        <!-- Company Name -->
                        <div class="form-group">
                            <label class="form-label">Company Name <span style="color: var(--danger)">*</span></label>
                            <input type="text" th:field="*{companyName}" class="form-control" placeholder="e.g. Google Cloud">
                            <p th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.25rem;"></p>
                        </div>

                        <!-- Location -->
                        <div class="form-group">
                            <label class="form-label">Job Location <span style="color: var(--danger)">*</span></label>
                            <input type="text" th:field="*{location}" class="form-control" placeholder="e.g. Bengaluru / Remote">
                            <p th:if="${#fields.hasErrors('location')}" th:errors="*{location}" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.25rem;"></p>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                        <!-- Category -->
                        <div class="form-group">
                            <label class="form-label">Job Category <span style="color: var(--danger)">*</span></label>
                            <select th:field="*{category}" class="form-control">
                                <option value="">-- Select Category --</option>
                                <option value="Software Engineering">Software Engineering</option>
                                <option value="Data Science & AI">Data Science & AI</option>
                                <option value="Cloud & DevOps">Cloud & DevOps</option>
                                <option value="Cybersecurity">Cybersecurity</option>
                                <option value="Product Management">Product Management</option>
                            </select>
                            <p th:if="${#fields.hasErrors('category')}" th:errors="*{category}" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.25rem;"></p>
                        </div>

                        <!-- Job Type -->
                        <div class="form-group">
                            <label class="form-label">Job Type <span style="color: var(--danger)">*</span></label>
                            <select th:field="*{jobType}" class="form-control">
                                <option value="Full-Time">Full-Time</option>
                                <option value="Internship">Internship</option>
                                <option value="Part-Time">Part-Time</option>
                                <option value="Contract">Contract</option>
                            </select>
                            <p th:if="${#fields.hasErrors('jobType')}" th:errors="*{jobType}" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.25rem;"></p>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                        <!-- Experience Level -->
                        <div class="form-group">
                            <label class="form-label">Experience Level <span style="color: var(--danger)">*</span></label>
                            <select th:field="*{experienceLevel}" class="form-control">
                                <option value="Fresher / Entry Level">Fresher / Entry Level</option>
                                <option value="1-3 Years">1-3 Years</option>
                                <option value="3-5 Years">3-5 Years</option>
                                <option value="5+ Years Senior">5+ Years Senior</option>
                            </select>
                            <p th:if="${#fields.hasErrors('experienceLevel')}" th:errors="*{experienceLevel}" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.25rem;"></p>
                        </div>

                        <!-- Salary Package -->
                        <div class="form-group">
                            <label class="form-label">Salary / Compensation <span style="color: var(--danger)">*</span></label>
                            <input type="text" th:field="*{salary}" class="form-control" placeholder="e.g. ₹12 - ₹16 LPA or ₹30k/mo">
                            <p th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.25rem;"></p>
                        </div>
                    </div>

                    <!-- Required Skills -->
                    <div class="form-group">
                        <label class="form-label">Required Skills (Comma separated) <span style="color: var(--danger)">*</span></label>
                        <input type="text" th:field="*{skillsRequired}" class="form-control" placeholder="e.g. Java, Spring Boot, React, PostgreSQL, Docker">
                        <p th:if="${#fields.hasErrors('skillsRequired')}" th:errors="*{skillsRequired}" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.25rem;"></p>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label class="form-label">Job Description & Requirements <span style="color: var(--danger)">*</span></label>
                        <textarea th:field="*{description}" rows="5" class="form-control" placeholder="Explain the project scope, tech stack, responsibilities, and interview process..."></textarea>
                        <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.25rem;"></p>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                        <a th:href="@{/employer/dashboard}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <span th:text="${isEdit ? 'Save Changes' : 'Publish Job Listing'}">Publish Job</span>
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <div th:replace="fragments/layout :: footer"></div>

</body>
</html>
